<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A4D2E" />
    <title>NestList — Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background: #F9FAFB;
        color: #111827;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: linear-gradient(135deg, #1E6B4A, #34D399);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 32px;
        font-weight: 700;
        font-family: 'DM Serif Display', Georgia, serif;
        margin-bottom: 20px;
        box-shadow: 0 4px 16px rgba(30,107,74,0.2);
      }
      h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
      p { color: #6B7280; font-size: 14px; line-height: 1.6; margin-bottom: 24px; max-width: 320px; }
      .signal {
        width: 80px; height: 80px; border-radius: 50%;
        background: #FEF3C7; display: flex; align-items: center;
        justify-content: center; font-size: 40px; margin-bottom: 20px;
      }
      .btn {
        background: linear-gradient(135deg, #1E6B4A, #34D399);
        color: #fff; border: none; border-radius: 12px;
        padding: 14px 28px; font-size: 15px; font-weight: 700;
        font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer;
        box-shadow: 0 4px 16px rgba(30,107,74,0.3);
      }
      .btn:hover { transform: translateY(-1px); }
      .btn:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="signal">📡</div>
    <div class="logo">N</div>
    <h1>You're Offline</h1>
    <p>
      NestList needs an internet connection to load property listings.
      Please check your connection and try again.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Try Again
    </button>
    <script>
      // Auto-retry when back online
      window.addEventListener('online', () => { window.location.reload(); });
    </script>
  </body>
</html>
